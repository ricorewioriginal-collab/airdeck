# Reverse-Proxy-Beispiel für die öffentliche Demo.
# AnMaCha Cast: 127.0.0.1:8751, Icecast: 127.0.0.1:8752. Beide Ports bleiben extern geschlossen.
server {
    listen 443 ssl http2;
    server_name anmachacast-demo.ricorewi-radio.de;

    ssl_certificate     /etc/letsencrypt/live/anmachacast-demo.ricorewi-radio.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anmachacast-demo.ricorewi-radio.de/privkey.pem;

    client_max_body_size 200m;

    # Öffentlicher Audio-Pfad. /stream/anmachacast-demo.mp3 wird intern zu
    # Icecast /anmachacast-demo.mp3 weitergereicht.
    location /stream/ {
        proxy_pass http://127.0.0.1:8752/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8751;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name anmachacast-demo.ricorewi-radio.de;
    return 301 https://$host$request_uri;
}
