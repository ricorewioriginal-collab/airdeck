# Für KeyHelp (oder ein anderes Panel, das Apache/Zertifikate selbst verwaltet):
# Subdomain anmachacast-demo.ricorewi-radio.de anlegen und HTTPS aktivieren.
# AnMaCha Cast und Icecast bleiben lokal gebunden; nur /stream/ wird öffentlich zu Icecast geleitet.
#
# --- ab hier ins Panel einfügen ---
ProxyPreserveHost On
ProxyRequests Off
SetEnv proxy-sendchunked 1

# Reihenfolge ist wichtig: spezifischen Stream-Pfad vor dem allgemeinen AnMaCha-Cast-Proxy definieren.
ProxyPass        /stream/ http://127.0.0.1:8752/ flushpackets=on
ProxyPassReverse /stream/ http://127.0.0.1:8752/
ProxyPass        / http://127.0.0.1:8751/ flushpackets=on
ProxyPassReverse / http://127.0.0.1:8751/
# --- bis hier ---
#
# Ohne Panel den Block in einen HTTPS-VirtualHost übernehmen. Benötigt:
#   a2enmod proxy proxy_http ssl
