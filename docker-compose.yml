# AnMaCha-Cast-Server: docker compose up -d   →   Studio: http://<server>:8750
# Service-/Container-/Volume-Namen heißen jetzt "anmachacast" (vorher "airdeck") - für EINE bestehende
# Installation, die noch die alten Volume-Namen (`airdeck-data`/`airdeck-pg`) nutzt, legt `docker compose up`
# sonst neue, leere Volumes an; siehe docs/DOCKER.md für die Migration bestehender Daten. Die
# AIRDECK_DB*-Variablennamen selbst bleiben bewusst unverändert (siehe docs/REBRANDING_ANMACHA_CAST.md
# Phase 3/7): eine Änderung würde einen per .env gesetzten Legacy-Namen stillschweigend überstimmen.
# Anmeldung beim ersten Start steht im Log:  docker compose logs anmachacast | grep -A1 -e Admin-Token -e Einmal-Passwort
#
# Datenbank: PostgreSQL (Standard für Server). Das Passwort bitte in einer Datei .env neben dieser Datei setzen:
#   AIRDECK_DB_PASSWORD=<langes zufälliges Passwort>
# Die Datenbank ist nur im internen Netz der Container erreichbar, kein Port nach außen.
# Ohne PostgreSQL (kleine Installation, SQLite im Datenordner): den Dienst „postgres“ und die drei AIRDECK_DB-Zeilen entfernen.
services:
  anmachacast:
    build: .
    image: anmachacast:latest
    container_name: anmachacast
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8750:8750"
    volumes:
      - anmachacast-data:/data
    environment:
      TZ: Europe/Berlin
      AIRDECK_DB: postgres
      AIRDECK_DB_URL: postgres://anmachacast@postgres:5432/anmachacast
      AIRDECK_DB_PASSWORD: ${AIRDECK_DB_PASSWORD:-anmachacast-bitte-aendern}
      # Optional: eigener Port
      # AIRDECK_PORT: 8750

  postgres:
    image: postgres:17
    container_name: anmachacast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anmachacast
      POSTGRES_DB: anmachacast
      POSTGRES_PASSWORD: ${AIRDECK_DB_PASSWORD:-anmachacast-bitte-aendern}
    volumes:
      - anmachacast-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anmachacast -d anmachacast"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  anmachacast-data:
  anmachacast-pg:
