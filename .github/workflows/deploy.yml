name: Deploy

on:
  push:
    branches: ['AirDeck-Radio-Automation-&-Broadcast']
    paths-ignore:
      - 'docs/screenshots/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag, das ausgerollt werden soll"
        required: false
        default: "AirDeck-Radio-Automation-&-Broadcast"

# Automatischer Rollout bei Push + manueller Start moeglich.
# Fuehrt git fetch/checkout + docker compose up -d --build auf dem Server aus.
# Laeuft nur mit vollstaendig hinterlegten Secrets (siehe docs/DEPLOY.md).
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
      DEPLOY_REF: ${{ github.ref_name }}
    steps:
      - name: Secrets pruefen
        run: |
          missing=""
          [ -z "$DEPLOY_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_USER" ] && missing="$missing DEPLOY_USER"
          [ -z "$DEPLOY_SSH_KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          [ -z "$DEPLOY_PATH" ] && missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Secrets:$missing - siehe docs/DEPLOY.md"
            exit 1
          fi
      - name: SSH-Schluessel einrichten
        run: |
          port="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
      - name: Rollout per SSH (git fetch + docker compose up -d --build)
        run: |
          port="${DEPLOY_PORT:-22}"
          quoted_ref=$(printf '%q' "$DEPLOY_REF")
          quoted_path=$(printf '%q' "$DEPLOY_PATH")
          ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
            set -e
            cd $quoted_path
            git fetch origin $quoted_ref
            git checkout $quoted_ref
            git reset --hard origin/$quoted_ref
            if ! docker compose version > /dev/null 2>&1; then
              (command -v apt-get > /dev/null 2>&1 && \
                (command -v sudo > /dev/null 2>&1 && sudo apt-get update -qq && sudo apt-get install -y -qq docker-compose-plugin \
                  || (apt-get update -qq && apt-get install -y -qq docker-compose-plugin))) \
                || true
            fi
            if ! docker compose version > /dev/null 2>&1; then
              mkdir -p ~/.docker/cli-plugins
              curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
                -o ~/.docker/cli-plugins/docker-compose
              chmod +x ~/.docker/cli-plugins/docker-compose
            fi
            docker compose version
            docker compose up -d --build
            docker compose ps
          REMOTE
      - name: Health-Check
        run: |
          if [ -z "$DEPLOY_HEALTH_URL" ]; then
            echo "DEPLOY_HEALTH_URL nicht gesetzt - Health-Check uebersprungen."
            exit 0
          fi
          for i in $(seq 1 30); do
            curl -fs "$DEPLOY_HEALTH_URL" > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::Health-Check unter DEPLOY_HEALTH_URL nach 60 s nicht erreicht."
          exit 1
