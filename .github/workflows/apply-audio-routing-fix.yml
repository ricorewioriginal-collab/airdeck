name: Apply audio routing fix
on:
  push:
    branches: [fix/independent-output-source-priority]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/independent-output-source-priority
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Patch encoder/output separation
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/server/model.ts')
          s = p.read_text()
          old = "  mp3Quality?: number;\n}"
          new = "  mp3Quality?: number;\n  /** Encoder unabhängig von den Stream-Ausgängen aktivieren/deaktivieren (Standard: aktiv). */\n  enabled?: boolean;\n}"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/server/app.ts')
          s = p.read_text()
          old = "      mp3Quality,\n    };"
          new = "      mp3Quality,\n      enabled: Boolean(input.enabled ?? prev?.enabled ?? true),\n    };"
          assert old in s
          s = s.replace(old, new, 1)
          old = "    const neededIds = new Set(\n      [...this.outputs.values()].filter((o) => o.cfg.stationId === stationId && o.cfg.enabled && o.cfg.profileId).map((o) => o.cfg.profileId!),\n    );"
          new = "    // Encoder und Stream-Ausgang sind getrennte Schalter: Ein Profil kann laufen,\n    // auch wenn gerade kein Ausgang verbunden ist. Die Source-Priority entscheidet\n    // davor, welche Quelle den Programmbus speist; der Encoder folgt diesem Bus.\n    const neededIds = new Set(list.filter((sp) => sp.enabled !== false).map((sp) => sp.id));"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('studio/js/app.js')
          s = p.read_text()
          marker = "{ name: 'bitrateKbps',"
          idx = s.find(marker, s.find('async function editStreamProfile'))
          assert idx >= 0
          end = s.find('\n', idx)
          line = s[idx:end]
          insert = "\n    { name: 'enabled', label: 'Encoder aktiv', type: 'checkbox', value: sp?.enabled !== false, hint: 'Unabhängig vom Stream-Ausgang: Encoder kann laufen, während der Stream-Ausgang aus ist.' },"
          if "name: 'enabled', label: 'Encoder aktiv'" not in s[s.find('async function editStreamProfile'):s.find('async function editStreamProfile')+2500]:
              s = s[:end] + insert + s[end:]
          p.write_text(s)

          p = Path('test/encoder-output-independence.test.ts')
          p.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n\ntest('encoder activation is independent from output.enabled', () => {\n  const app = readFileSync('src/server/app.ts', 'utf8');\n  assert.match(app, /list\.filter\(\(sp\) => sp\.enabled !== false\)/);\n  assert.doesNotMatch(app, /o\.cfg\.enabled && o\.cfg\.profileId/);\n});\n\ntest('studio exposes an independent encoder switch', () => {\n  const ui = readFileSync('studio/js/app.js', 'utf8');\n  assert.match(ui, /name: 'enabled', label: 'Encoder aktiv'/);\n});\n""")
      - name: Typecheck and test
        run: npm run check
      - name: Commit verified fix and remove one-shot workflow
        run: |
          rm .github/workflows/apply-audio-routing-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/model.ts src/server/app.ts studio/js/app.js test/encoder-output-independence.test.ts .github/workflows/apply-audio-routing-fix.yml
          git commit -m "fix: decouple source priority, encoder and stream output"
          git push
