name: Apply TypeScript 7 update
on:
  push:
    branches: [fix/typescript-7-current]
permissions:
  contents: write
jobs:
  update-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: fix/typescript-7-current }
      - uses: actions/setup-node@v5
        with: { node-version: '22.18', cache: npm }
      - run: npm install --save-dev typescript@7.0.2 --no-audit --no-fund
      - name: Apply TS7 compatibility fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('studio/js/handbuch.js'); s=p.read_text()
          s=s.replace("const match = !term || /** @type {HTMLElement} */ (section).textContent?.toLowerCase().includes(term);", "const match = !term || Boolean(/** @type {HTMLElement} */ (section).textContent?.toLowerCase().includes(term));")
          s=s.replace("/** @type {HTMLElement} */ (a).hidden = !!target && /** @type {HTMLElement} */ (target).hidden;", "/** @type {HTMLElement} */ (a).hidden = Boolean(target && /** @type {HTMLElement} */ (target).hidden);")
          p.write_text(s)
      - run: npm run check
      - name: Commit verified update
        run: |
          rm .github/workflows/apply-typescript7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json studio/js/handbuch.js .github/workflows/apply-typescript7.yml
          git commit -m "deps: update TypeScript to 7.0.2 on current base"
          git push
