name: Release Badge

on:
  release:
    types: [published, released, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airdeck-release-badge
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: AirDeck-Radio-Automation-&-Broadcast
          fetch-depth: 0

      - name: Aktuelles Release ermitteln und AirDeck-Badge erzeugen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(gh api repos/${{ github.repository }}/releases/latest)"
          NAME="$(jq -r '.name // .tag_name' <<<"$JSON")"
          TAG="$(jq -r '.tag_name' <<<"$JSON")"
          DISPLAY="$TAG"
          CODENAME="$(sed -nE 's/^AirDeck[[:space:]]+(.+)[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+.*$/\1/p' <<<"$NAME" | head -1)"
          if [ -z "$CODENAME" ] || [ "$CODENAME" = "$NAME" ]; then CODENAME=""; fi
          STATUS="$CODENAME"
          if [ -z "$STATUS" ] && grep -qi 'beta' <<<"$NAME $TAG"; then STATUS="BETA"; fi
          export DISPLAY STATUS
          python3 - <<'PY'
          import html, os
          display=html.escape(os.environ['DISPLAY'])
          status=html.escape(os.environ.get('STATUS','').upper())
          status_svg = '' if not status else f'<rect x="238" y="43" width="96" height="27" rx="13.5" fill="#102d4a" stroke="#1c6c98"/><text x="286" y="62" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#7ed7ff">{status}</text>'
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="430" height="92" viewBox="0 0 430 92" role="img" aria-label="Aktuelle AirDeck Version {display} {status}">
          <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset=".55" stop-color="#0a2340"/><stop offset="1" stop-color="#123b70"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#18b7ff"/><stop offset="1" stop-color="#4d8dff"/></linearGradient></defs>
          <rect x="2" y="2" width="426" height="88" rx="22" fill="url(#bg)" stroke="#1e6595" stroke-width="2"/>
          <circle cx="49" cy="46" r="25" fill="#071b31" stroke="url(#accent)" stroke-width="2"/><path d="M37 48l9 9 17-22" fill="none" stroke="#55d7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="88" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#79cdf6">AKTUELLE VERSION</text><text x="88" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff">{display}</text>{status_svg}<path d="M378 39l13 7-13 7" fill="none" stroke="#55d7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'''
          open('assets/readme/status/version.svg','w',encoding='utf-8').write(svg)
          PY

      - name: README auf AirDeck-Versionsbutton vereinheitlichen
        shell: python
        run: |
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<a href="https://github\.com/ricorewioriginal-collab/airdeck/releases/latest"><img src="https://img\.shields\.io/github/v/release/ricorewioriginal-collab/airdeck\?[^\"]+" height="46" alt="Aktuelle AirDeck-Version"></a>', '<a href="https://github.com/ricorewioriginal-collab/airdeck/releases/latest"><img src="assets/readme/status/version.svg" height="46" alt="Aktuelle AirDeck-Version"></a>', s)
          p.write_text(s,encoding='utf-8')

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet -- README.md assets/readme/status/version.svg; then
            echo 'Badge ist bereits aktuell.'
            exit 0
          fi
          git config user.name 'AirDeck CI'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md assets/readme/status/version.svg
          git commit -m 'README: aktuelle Release-Version [skip ci]'
          git push origin HEAD:AirDeck-Radio-Automation-&-Broadcast
