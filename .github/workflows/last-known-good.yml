name: Last Known Good

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: "Aktion"
        required: true
        type: choice
        options: [show, rollback]
      confirm:
        description: "Für manuellen Rollback exakt ROLLBACK eingeben"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: anmachacast-last-known-good
  cancel-in-progress: false

env:
  BRANCH: main

jobs:
  remember:
    name: Letzten grünen Build merken
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Erfolgreichen Commit als last-known-good markieren
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init repo && cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$SHA"
          git tag -f last-known-good "$SHA"
          git push --force origin refs/tags/last-known-good
          echo "last-known-good -> $SHA"

  auto-rollback:
    name: Automatischer sicherer Rollback
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'revert: automatic rollback') &&
      !startsWith(github.event.workflow_run.head_commit.message, 'revert: rollback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Rollback-Ziel und Branchzustand prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          GOOD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/last-known-good" --jq '.object.sha' 2>/dev/null || true)"
          CURRENT="$(git rev-parse HEAD)"
          if [ -z "$GOOD" ]; then
            echo "::warning::Noch kein last-known-good vorhanden. Automatischer Rollback wird nicht durchgeführt."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$CURRENT" != "$FAILED_SHA" ]; then
            echo "::warning::Branch wurde nach dem fehlgeschlagenen Build bereits verändert. Kein automatischer Rollback, damit neuere Arbeit nicht überschrieben wird."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$GOOD" = "$CURRENT" ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git merge-base --is-ancestor "$GOOD" "$CURRENT" || {
            echo "::warning::last-known-good ist kein Vorfahr des aktuellen Branches. Kein automatischer Rollback."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          }
          echo "GOOD=$GOOD" >> "$GITHUB_ENV"
          echo "CURRENT=$CURRENT" >> "$GITHUB_ENV"
          echo "SKIP=0" >> "$GITHUB_ENV"

      - name: Fehlgeschlagene Änderungen als Revert-Commit zurücknehmen
        if: env.SKIP == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AnMaCha Cast Auto Rollback'
          git config user.email 'actions@users.noreply.github.com'
          git revert --no-commit "$GOOD..$CURRENT"
          if git diff --cached --quiet && git diff --quiet; then
            echo "Keine rücknehmbaren Änderungen."
            exit 0
          fi
          # Direkter Push auf den geschuetzten Hauptbranch scheitert an der Repository-Regel
          # "Changes must be made through a pull request" (GH013) - wie beim frueheren
          # Screenshots-Job (siehe build.yml). Daher wie die anderen Automations-Workflows
          # (changelog.yml, release-badge.yml, release-screenshots.yml) ueber einen eigenen
          # Branch + PR einreichen, statt den Branch-Schutz zu unterlaufen. Kein "[skip ci]" mehr:
          # der PR braucht gruene Pflicht-Checks, bevor er (auto-)gemergt werden kann. Commit- und
          # PR-Titel bleiben identisch zur bisherigen Commit-Nachricht, damit die obige
          # startsWith(...)-Schleifenbremse beim spaeteren Squash-Merge weiterhin greift.
          TITLE="revert: automatic rollback to last known good $GOOD"
          BRANCH="automation/rollback-${GOOD}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "Der zuletzt gebaute Stand ist fehlgeschlagen. Dieser PR nimmt die seit dem letzten erfolgreichen Build ($GOOD) hinzugekommenen Aenderungen als nachvollziehbaren Revert-Commit zurueck. Branch-Schutz und CI bleiben aktiv - bitte zeitnah pruefen und mergen.")"
          PR_NUMBER="${PR_URL##*/}"
          gh pr merge "$PR_NUMBER" --auto --squash || true
          echo "::warning::Automatischer Rollback auf $GOOD als PR #${PR_NUMBER} eingereicht (Auto-Merge angefordert, greift erst nach gruenen Pflicht-Checks) - Branch-Schutz verlangt das, daher kein direkter Push."

  show:
    name: Last Known Good anzeigen
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'show'
    runs-on: ubuntu-latest
    steps:
      - name: Status ausgeben
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/last-known-good" --jq '.object.sha')"
          echo "Letzter erfolgreicher AnMaCha-Cast-Build: $SHA"
          gh api "repos/${GITHUB_REPOSITORY}/commits/$SHA" --jq '"Commit: " + .sha + "\nDatum: " + .commit.committer.date + "\nNachricht: " + .commit.message'

  rollback:
    name: Manueller Rollback
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Sicherheitsbestätigung prüfen
        shell: bash
        run: |
          test "${{ inputs.confirm }}" = "ROLLBACK" || { echo "::error::Im Feld confirm muss exakt ROLLBACK stehen."; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Last Known Good wiederherstellen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          GOOD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/last-known-good" --jq '.object.sha')"
          CURRENT="$(git rev-parse HEAD)"
          [ "$GOOD" != "$CURRENT" ] || exit 0
          git merge-base --is-ancestor "$GOOD" "$CURRENT" || { echo "::error::Unsicherer Verlauf; Rollback abgebrochen."; exit 1; }
          git config user.name 'AnMaCha Cast Rollback'
          git config user.email 'actions@users.noreply.github.com'
          git revert --no-commit "$GOOD..$CURRENT"
          # Wie beim automatischen Rollback: Branch-Schutz (GH013) verbietet den direkten Push,
          # also ueber einen eigenen Branch + PR einreichen statt den Schutz zu unterlaufen.
          TITLE="revert: rollback to last known good $GOOD"
          BRANCH="automation/manual-rollback-${GOOD}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "Manuell angeforderter Rollback auf $GOOD. Branch-Schutz und CI bleiben aktiv - bitte pruefen und mergen.")"
          PR_NUMBER="${PR_URL##*/}"
          gh pr merge "$PR_NUMBER" --auto --squash || true
          echo "::warning::Manueller Rollback auf $GOOD als PR #${PR_NUMBER} eingereicht (Auto-Merge angefordert) - Branch-Schutz verlangt das, daher kein direkter Push."
