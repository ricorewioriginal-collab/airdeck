name: Deploy AnMaCha Cast Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/openapi.json'
      - 'studio/api-docs.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: API-Dokumentation einbinden
        run: |
          cp docs/openapi.json site/openapi.json
          sed "s#const STATIC_DOCS = false;#const STATIC_DOCS = true;#" studio/api-docs.html > site/api.html
          grep -q "STATIC_DOCS = true" site/api.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
